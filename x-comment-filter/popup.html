<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 评论过滤</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <h1>X 评论过滤</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span>启用</span>
    </label>
  </header>

  <section>
    <h2>生效范围</h2>
    <label class="row"><input type="checkbox" id="ctx_post_thread" checked disabled /> 单帖 / Thread 评论</label>
    <label class="row dim"><input type="checkbox" id="ctx_timeline" disabled /> 时间线（即将支持）</label>
    <label class="row dim"><input type="checkbox" id="ctx_article" disabled /> 文章页（即将支持）</label>
  </section>

  <section>
    <h2>账号屏蔽</h2>
    <label class="row"><input type="checkbox" id="rule_blocklist" checked /> 启用账号屏蔽</label>
    <p class="hint" id="blocklist_count">0 个账号</p>
    <textarea id="blocklist" rows="3" placeholder="每行一个 @handle"></textarea>
    <button type="button" id="save_blocklist" class="primary">保存账号</button>
  </section>

  <section>
    <h2>评论关键词</h2>
    <label class="row"><input type="checkbox" id="rule_text_keywords" checked /> 启用关键词屏蔽</label>
    <p class="hint" id="keywords_count">0 个关键词</p>
    <textarea id="text_keywords" rows="3" placeholder="每行一个词，评论正文包含即过滤"></textarea>
    <button type="button" id="save_keywords" class="primary">保存关键词</button>
  </section>

  <section>
    <h2>自动规则</h2>
    <label class="row"><input type="checkbox" id="rule_probable_spam" /> X 垃圾区</label>
    <label class="row"><input type="checkbox" id="rule_mention_spam" /> 短句多 @</label>
    <label class="row"><input type="checkbox" id="rule_emoji_spam" /> 纯表情</label>
    <label class="row"><input type="checkbox" id="rule_display_name_keywords" /> 昵称关键词</label>
  </section>

  <button type="button" id="open_library" class="secondary">查看记录 / 导出</button>

  <p class="foot" id="page_stats"></p>

  <script src="shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
