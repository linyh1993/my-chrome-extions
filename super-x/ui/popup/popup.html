<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperX 控制中心</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="superx-popup">
    <!-- 头部 -->
    <header class="header">
      <div class="logo-area">
        <img src="../../icons/icon48.png" alt="SuperX Logo" class="logo-icon">
        <div>
          <h1 class="title">SuperX</h1>
          <p class="subtitle">X 全能聚合助手</p>
        </div>
      </div>
      <div class="version-badge">v1.0.0</div>
    </header>

    <!-- 模块列表 -->
    <main class="features-list">
      <!-- 1. 垃圾评论净化模块 -->
      <div class="feature-card" data-feature="x-comment-cleaner">
        <div class="card-top-row">
          <div class="feature-title-area">
            <span class="feature-icon">🛡️</span>
            <div>
              <div class="feature-name">X 垃圾评论净化</div>
              <div class="feature-stat">已累计拦截 <strong id="popup-blocked-count">0</strong> 条</div>
            </div>
          </div>
          <label class="switch" title="模块主开关">
            <input type="checkbox" id="toggle-cleaner" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="quick-options-box" id="cleaner-quick-options">
          <div class="option-row">
            <label class="sub-checkbox-label">
              <input type="checkbox" id="popup-auto-block">
              <span>自动原生拉黑 (防封流控)</span>
            </label>
          </div>
          <div class="option-row mode-row">
            <span class="option-label">形式:</span>
            <label class="radio-inline">
              <input type="radio" name="popupHideMode" value="collapse" id="popupModeCollapse" checked>
              <span>聚合折叠</span>
            </label>
            <label class="radio-inline">
              <input type="radio" name="popupHideMode" value="hide" id="popupModeHide">
              <span>完全隐藏</span>
            </label>
          </div>
          <button type="button" class="btn-card-action" id="btn-goto-cleaner-settings">
            ⚙️ 8大词库与白名单管理 (侧边栏)
          </button>
        </div>
      </div>

      <!-- 2. Better UI 界面优化模块 -->
      <div class="feature-card" data-feature="x-better-ui">
        <div class="card-top-row">
          <div class="feature-title-area">
            <span class="feature-icon">📑</span>
            <div>
              <div class="feature-name">Better UI 界面增强</div>
              <div class="feature-desc">纯净阅读与版面自适应加宽</div>
            </div>
          </div>
          <label class="switch" title="模块主开关">
            <input type="checkbox" id="toggle-better-ui" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="quick-options-box" id="ui-quick-options">
          <div class="option-row">
            <label class="sub-checkbox-label">
              <input type="checkbox" id="popup-hide-trends" checked>
              <span>隐藏侧边栏趋势与新鲜事</span>
            </label>
          </div>
          <div class="option-row">
            <label class="sub-checkbox-label">
              <input type="checkbox" id="popup-widen" checked>
              <span>正文与时间线加宽 15%</span>
            </label>
          </div>
          <div class="option-row">
            <label class="sub-checkbox-label">
              <input type="checkbox" id="popup-outline" checked>
              <span>长文自动生成目录大纲</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 3. Follow 批量转列表模块 -->
      <div class="feature-card" data-feature="x-follow-to-list">
        <div class="card-top-row">
          <div class="feature-title-area">
            <span class="feature-icon">👥</span>
            <div>
              <div class="feature-name">Follow 批量转列表</div>
              <div class="feature-stat">已捕获 <strong id="popup-follow-count">0</strong> 位关注者</div>
            </div>
          </div>
          <label class="switch" title="模块主开关">
            <input type="checkbox" id="toggle-follow-list" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="quick-options-box" id="follow-quick-options">
          <div class="option-row">
            <button type="button" class="btn-card-action" id="btn-goto-follow-curator">
              🚀 打开关注导入与管理工作台 (侧边栏)
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部操作区 -->
    <footer class="footer">
      <button type="button" id="btn-open-sidepanel" class="btn-sidepanel">
        <span>⚙️</span> 打开侧边栏完整工作台 (Side Panel)
      </button>
    </footer>
  </div>

  <script src="../../core/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
