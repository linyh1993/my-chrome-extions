<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Traffic Mirror</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <h1>X Traffic Mirror</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span>Mirror</span>
    </label>
  </header>

  <section>
    <div class="row">
      <span class="label">Site</span>
      <span id="site">-</span>
    </div>
    <div class="row">
      <span class="label">Status</span>
      <span id="status">-</span>
    </div>
  </section>

  <label class="field">
    <span>Local endpoint</span>
    <input id="mirror_url" type="url" spellcheck="false" />
  </label>

  <button type="button" id="save" class="primary">Save</button>
  <p class="foot" id="message"></p>

  <script src="../../shared/mirror-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
