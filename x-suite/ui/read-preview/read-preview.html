<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Suite · 阅读独立页预览</title>
  <link rel="stylesheet" href="read-preview.css" />
</head>
<body class="mode-read read-preview-page">
  <header class="preview-hero">
    <div class="preview-copy">
      <p class="preview-kicker">X Suite Preview</p>
      <h1>阅读独立页预览</h1>
      <p class="sub" id="page_hint">把 options 里的“阅读”抽成单独页面后的预览版本；当前仍不替换现有 options。</p>
    </div>
    <div class="preview-actions">
      <button type="button" id="btn_refresh" class="preview-btn">刷新数据</button>
      <a class="preview-link" href="../options/options.html#read">对照现有阅读页</a>
    </div>
  </header>

  <section class="preview-stats" aria-label="阅读概览">
    <article class="preview-stat">
      <span class="preview-stat-label">当前视图</span>
      <strong id="view_mode_label" class="preview-stat-value">加载中</strong>
    </article>
    <article class="preview-stat">
      <span class="preview-stat-label">帖子数</span>
      <strong id="stat_thread_count" class="preview-stat-value">0</strong>
    </article>
    <article class="preview-stat">
      <span class="preview-stat-label">非噪音回复</span>
      <strong id="stat_signal_count" class="preview-stat-value">0</strong>
    </article>
  </section>

  <div class="thread-bar" id="thread_bar" hidden>
    <div class="thread-bar-head">
      <span class="thread-bar-label">当前帖子</span>
      <span id="thread_total" class="thread-total"></span>
    </div>
    <div class="thread-combobox" id="thread_combobox">
      <div class="thread-current" id="thread_current" tabindex="0" role="button" aria-haspopup="listbox"></div>
      <input
        type="search"
        id="thread_search"
        class="thread-search"
        placeholder="搜索正文预览、账号或帖子 ID"
        autocomplete="off"
        aria-controls="thread_results"
        aria-expanded="false"
      />
      <ul id="thread_results" class="thread-results" role="listbox" hidden></ul>
    </div>
    <div class="thread-bar-actions">
      <button type="button" id="thread_view_all" class="preview-btn preview-btn-secondary">全部帖子</button>
      <a id="thread_open_x" class="thread-open" href="#" target="_blank" rel="noopener">在 X 打开</a>
    </div>
    <p class="thread-bar-hint">这个预览页只保留“阅读”体验：上面切帖子，下面直接看整理后的正文流。</p>
  </div>

  <main class="preview-panel">
    <div class="read-toolbar">
      <span class="read-summary" id="read_summary"></span>
      <span class="preview-inline-meta" id="thread_caption"></span>
    </div>
    <div id="read_feed" class="read-feed" aria-live="polite"></div>
    <p id="read_empty" class="read-empty">当前没有可展示的非噪音回复。打开帖子并让扩展完成采集后，再回到这里刷新即可。</p>
  </main>

  <script src="../../shared/constants.js"></script>
  <script src="read-preview.js"></script>
</body>
</html>
