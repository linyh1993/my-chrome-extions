<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni Relay</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="hdr">
      <div class="brand">
        <span class="logo">⚡</span>
        <div>
          <h1>Omni Relay</h1>
          <p class="tagline">多平台流量与数据中继</p>
        </div>
      </div>
      <label class="switch" title="全局主开关">
        <input type="checkbox" id="globalToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <!-- 当前 Tab 状态 -->
    <section class="card">
      <div class="card-hdr">
        <span class="label">当前标签页</span>
        <span class="pill" id="tabStatusPill">-</span>
      </div>
      <div class="tab-meta">
        <div class="row">
          <span>识别平台:</span>
          <b id="tabSiteName">-</b>
        </div>
        <div class="row">
          <span>活跃通道:</span>
          <b id="tabChannels">-</b>
        </div>
      </div>
    </section>

    <!-- 本地接收端设置 -->
    <section class="card">
      <div class="card-hdr">
        <span class="label">本地 Endpoint</span>
      </div>
      <input type="url" id="endpointUrl" spellcheck="false" placeholder="http://127.0.0.1:9090/relay" />
      <div class="actions">
        <button type="button" id="pingBtn" class="btn btn-sec">⚡ 测试连接</button>
        <button type="button" id="saveBtn" class="btn btn-pri">保存配置</button>
      </div>
      <div id="pingStatus" class="ping-status hidden"></div>
    </section>

    <!-- 平台策略 -->
    <section class="card">
      <div class="card-hdr">
        <span class="label">支持平台与采集策略</span>
      </div>
      <div id="sitesList" class="sites-list"></div>
    </section>

    <!-- 统计指标 -->
    <section class="card">
      <div class="card-hdr">
        <span class="label">累计中继指标</span>
        <button type="button" id="resetBtn" class="link-btn">清零</button>
      </div>
      <div class="metrics-row">
        <div class="metric">
          <span class="val" id="mTotal">0</span>
          <span class="sub">总中继条数</span>
        </div>
        <div class="metric">
          <span class="val" id="mX">0</span>
          <span class="sub">X (Twitter)</span>
        </div>
        <div class="metric">
          <span class="val" id="mReddit">0</span>
          <span class="sub">Reddit</span>
        </div>
      </div>
    </section>

    <!-- 底部消息栏 -->
    <footer class="ftr">
      <span id="footerMsg">就绪</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
