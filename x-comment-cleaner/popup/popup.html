<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X 垃圾评论拦截助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">🛡️</div>
        <div>
          <h1 class="title">X 垃圾评论拦截助手</h1>
          <p class="subtitle">净化评论区 · 原生拉黑 · 聚合折叠</p>
        </div>
      </div>
      <label class="switch" title="主开关">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Stat banner -->
    <div class="stats-card">
      <div class="stat-info">
        <span class="stat-num" id="blockedCount">0</span>
        <span class="stat-label">已拦截垃圾回复</span>
      </div>
      <button class="btn-text" id="resetCountBtn" title="重置计数">重置计数</button>
    </div>

    <!-- Mode selection -->
    <div class="section">
      <div class="section-title">拦截展示形式</div>
      <div class="mode-options">
        <label class="radio-label">
          <input type="radio" name="hideMode" value="collapse" id="modeCollapse" checked>
          <span class="radio-custom"></span>
          <span><b>连续多条聚合折叠</b>（带原因与顺手拉黑）</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="hideMode" value="hide" id="modeHide">
          <span class="radio-custom"></span>
          <span><b>完全隐藏</b>（无痕彻底清理）</span>
        </label>
      </div>
    </div>

    <!-- 8 Categorized Keyword Packs -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">8 大行业分类词库</span>
        <span class="section-desc">支持有序词距 (max_gap) 组合</span>
      </div>
      <div class="packs-grid" id="packsGrid">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Smart filters & Algorithms -->
    <div class="section">
      <div class="section-title">智能识别算法与启发式</div>
      <div class="filter-toggles">
        <label class="checkbox-row">
          <input type="checkbox" id="filterSimhash" checked>
          <div class="checkbox-info">
            <span class="checkbox-text"><b>64 位 SimHash 模糊指纹</b></span>
            <span class="checkbox-sub">自动识别换词、插符号的同款话术变体</span>
          </div>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="filterHeuristics" checked>
          <div class="checkbox-info">
            <span class="checkbox-text"><b>账号与可疑外链启发式</b></span>
            <span class="checkbox-sub">识别默认数字账号、空投/诈骗外链域名</span>
          </div>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="filterPureNumbers" checked>
          <div class="checkbox-info">
            <span class="checkbox-text">纯数字 / 随机单数字刷屏 (如 1、5、666 等)</span>
          </div>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="filterMentionSpam" checked>
          <div class="checkbox-info">
            <span class="checkbox-text">Bot 引流艾特模式识别 (@提及+随机后缀)</span>
          </div>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="filterDuplicates" checked>
          <div class="checkbox-info">
            <span class="checkbox-text">同帖多账号雷同刷屏 (Copypasta)</span>
          </div>
        </label>
      </div>
    </div>

    <!-- Whitelist Manager -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">免杀白名单 (<span id="whiteCount">0</span>)</span>
        <span class="section-desc">绝对不拦截、不拉黑</span>
      </div>
      <div class="input-row">
        <input type="text" id="whitelistInput" class="input" placeholder="输入账号 handle (如 elonmusk)..." maxlength="30">
        <button id="addWhitelistBtn" class="btn-primary">添加</button>
      </div>
      <div class="tags-container" id="whitelistList">
        <!-- Whitelist tags dynamically inserted here -->
      </div>
    </div>

    <!-- Custom Keywords Manager -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">自定义补充关键词 (<span id="customKwCount">0</span>)</span>
      </div>
      <div class="input-row">
        <input type="text" id="keywordInput" class="input" placeholder="输入自定义关键词..." maxlength="30">
        <button id="addKeywordBtn" class="btn-primary">添加</button>
      </div>
      <div class="tags-container" id="keywordsList">
        <!-- Custom keyword tags dynamically inserted here -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>已支持 X.com 与 Twitter.com · 原生拉黑全端同步</span>
      <span class="version">v2.0.0</span>
    </footer>
  </div>

  <script src="../shared/packs.js"></script>
  <script src="../shared/simhash.js"></script>
  <script src="../shared/heuristics.js"></script>
  <script src="../shared/rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
